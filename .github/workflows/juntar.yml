# Gera os arquivos com todos os açudes juntos e publica na versão "dados" do
# repositório, de onde qualquer pessoa baixa pelo endereço fixo
# https://github.com/ItsMeYoshiro/aguas-pb-dados/releases/download/dados/<arquivo>
#
# Os arquivos juntos NÃO entram no repositório: mudam todo dia e têm dezenas de
# MB, e o histórico do git guardaria cada versão para sempre. Numa versão
# publicada, cada atualização substitui a anterior.
name: Juntar os açudes

on:
  push:
    branches: [main]
    paths:
      - "diario/**"
      - "acudes.csv"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: juntar
  cancel-in-progress: true

jobs:
  juntar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sem `npm ci`: o script usa só o que vem com o Node.
      - name: Juntar
        run: node scripts/juntar.mjs

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          hoje=$(date -u +%Y-%m-%d)
          notas="Todos os açudes juntos, uma linha por açude e dia. Atualizado em ${hoje}."
          if ! gh release view dados >/dev/null 2>&1; then
            gh release create dados --title "Dados mais recentes" --notes "$notas" --latest
          else
            gh release edit dados --notes "$notas"
          fi
          gh release upload dados saida/acudes-paraiba-diario.csv saida/acudes-paraiba-diario.xlsx --clobber
